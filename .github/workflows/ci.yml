name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Skip in the template repo itself — it ships no web/package.json by
    # design (the user runs `npx create-next-app@latest web` at fork time),
    # so `npm ci` here would fail. Forks have a different `github.repository`
    # and CI runs normally on their first commit. Remove this `if:` if you
    # ever want CI to gate template-repo changes too (you'd also need to add
    # a real web/ — see the new-project-setup skill).
    if: github.repository != 'ItsMeEricV/agentic_coding_project_template'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Web app lives in web/ per the docker/nextjs/ stamp convention.
        # If your project doesn't follow that layout, adjust working-directory.
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # ORM: Prisma — uncomment if using Prisma; needed before tsc sees @prisma/client.
      # - run: npx prisma generate

      - name: Prettier check
        # Run against the whole repo, not just web/, so root configs / docs / yml stay clean.
        working-directory: ${{ github.workspace }}
        run: npx --yes prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      # Uncomment once web/ has a test suite (vitest, jest, playwright unit).
      # - name: Tests
      #   run: npm test

  python-tests:
    # Runs in the template repo AND forks — the cli/ Python helpers ship with
    # the template and have stdlib-only unit tests, so there's no install
    # step and no per-fork dependency on web/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unittest suite
        run: python -m unittest discover -s cli -p 'test_*.py' -v
