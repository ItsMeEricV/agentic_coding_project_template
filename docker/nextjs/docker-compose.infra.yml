# Long-lived, machine-wide infra. Bring up ONCE per machine (not per worktree),
# in its OWN standalone Compose project (`-p app-infra`):
#   docker compose -p app-infra -f docker-compose.infra.yml --env-file .env.docker up -d
# Tear down with the SAME project flag, or Compose won't find this group:
#   docker compose -p app-infra -f docker-compose.infra.yml down
#
# Why `-p app-infra` (load-bearing): `--env-file` loads .env.docker, which sets a
# PER-WORKTREE `COMPOSE_PROJECT_NAME` (e.g. <slug>-main). Without `-p`, Compose
# would file this shared infra under that worktree's project group and prefix the
# data volume with it. `-p` outranks `COMPOSE_PROJECT_NAME`, so infra stays in its
# own `app-infra` group — shared across worktrees — no matter which worktree's env
# file you point at. The top-level `name:` below only covers the no-env-file path;
# it does NOT survive `--env-file`, so the flag is what actually wins. Keep
# `--env-file` too: `COMPOSE_PROFILES` and `NGROK_AUTHTOKEN` (for ngrok) are still
# read from it; per-worktree vars are harmlessly ignored by infra services.
#
# Owns the shared Docker network `app_shared` and the `app_postgres_data` volume
# (both pinned via `name:` so they aren't project-prefixed). Every per-worktree
# app stack joins the network and resolves the database as the hostname `db` via
# the network alias below — so the db container_name can vary per project without
# the app stack caring. Substitute the `app_*` placeholders for your project's
# slug at bootstrap (see ../README.md and the new-project-setup skill):
# `app-infra` (project name), `app_shared` (network), `app_db` (container_name),
# `app_postgres_data` (volume), `app_dev` (POSTGRES_DB), and reassign the host
# port `5432` if needed. Otherwise two projects on the same machine will collide.

name: app-infra

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: app_db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_dev
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      app_shared:
        # Stable hostname `db` for any container on the shared network,
        # independent of container_name. Lets two projects use distinct
        # container names while their app stacks still resolve `db:5432`.
        aliases:
          - db
    deploy:
      resources:
        limits:
          memory: 1g

  ngrok:
    profiles: [ngrok]
    image: ngrok/ngrok:latest
    # Tunnels traffic from your reserved ngrok domain to whichever worktree is
    # publishing host port 3000. Only one worktree at a time gets the public URL
    # (the one that set WEB_PORT=3000); other worktrees still run locally, just
    # unexposed. Replace YOUR_NGROK_DOMAIN with your reserved ngrok hostname.
    command: http host.docker.internal:3000 --domain YOUR_NGROK_DOMAIN
    # NGROK_AUTHTOKEN must be set in .env.docker.
    env_file:
      - ./.env.docker
    ports:
      - '4040:4040'
    networks:
      - app_shared
    deploy:
      resources:
        limits:
          memory: 500m

volumes:
  app_postgres_data:
    # Pinned (like the network below) so the actual Docker volume name is exactly
    # this, never prefixed by the Compose project. Survives across worktrees and
    # the `app-infra` project name.
    name: app_postgres_data

networks:
  app_shared:
    name: app_shared
