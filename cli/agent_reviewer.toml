# Model roster for cli/agent_code_reviewer.py.
#
# Committed on purpose: a forked project gets a working reviewer with no setup
# beyond an API key. Contains NO secrets — keys live in env vars, named per
# access method below.
#
# Run `uv run cli/agent_code_reviewer.py --list` to see this file resolved,
# including which API keys are actually set in your environment.

# Model used when --model is omitted. Must match a key below.
default = "codex-sol"

# The day the model catalog was last weighed against this roster. A listing
# after it that could change an entry is reported at every session start and on
# every review run: a higher major version of an entry's family
# (`claude-opus-5.5` -> `claude-opus-6`), or a family no entry uses from a
# vendor below (`gemini-4-argon` beside `gemini-3.1-pro`). Decide, then move
# the date; declining counts.
catalog_reviewed = 2026-10-20

# Each entry declares:
#   key            short slug passed to --model; also names the entry's history
#                  file (/tmp/agent_reviewer_<key>.json). Renaming it breaks
#                  saved invocations — treat it as stable.
#   name           human label, shown by --list --verbose.
#   access_method  which API to speak. This IS the wire protocol:
#                    openrouter  -> OpenRouter chat.send      (OPENROUTER_API_KEY)
#                    gemini_api  -> Gemini generateContent    (GEMINI_API_KEY)
#                    openai_api  -> OpenAI Responses API      (OPENAI_API_KEY)
#   id             model identifier sent to that API.
#   tag            OPTIONAL. Attribution tag on inline PR comments, per
#                  AGENTS.md. Defaults to key.upper().
#   context_window OPTIONAL, tokens, default 128K. Sizes a --pr diff: one that
#                  does not fit is refused with the entries that would take it.
#                  Copy the figure `--find-model` prints; a guess that is too
#                  high overflows the model instead of failing early.
#   max_output_tokens OPTIONAL, tokens. Sent as the call's output cap
#                  (reasoning counts against it) and held back from the window
#                  when sizing a --pr diff. Unset, no cap is sent, the provider's
#                  default applies, and 32K is held back. Never above
#                  `--find-model`'s MAX OUT.
#   store          OPTIONAL, openai_api only, default false. Makes OpenAI retain
#                  every payload server-side (private --pr diffs included) in
#                  exchange for not re-sending the transcript each turn; only
#                  worth it for long --session work. No entry uses it today.
#
# Entries are listed deepest-first; the cheap ones are at the bottom.

# 5x the price of codex-sol for the same context window — reach for it on
# load-bearing reviews (security boundaries, migrations, novel subsystems),
# not as the everyday default.
[[models]]
key = "codex-astra"
name = "Codex GPT-6 Astra — OpenRouter"
access_method = "openrouter"
id = "openai/gpt-6-astra"
context_window = 1_050_000
tag = "CODEX"

[[models]]
key = "codex-sol"
name = "Codex GPT-6.1 Sol — OpenRouter"
access_method = "openrouter"
id = "openai/gpt-6.1-sol"
context_window = 1_050_000
# The published cap: "max_completion_tokens": 128000 on
# https://openrouter.ai/openai/gpt-6.1-sol, checked 2026-10-22.
max_output_tokens = 128_000
tag = "CODEX"

[[models]]
key = "gemini-argon"
name = "Gemini 4 Argon — Google API"
access_method = "gemini_api"
id = "gemini-4-argon"
context_window = 1_048_576
tag = "GEMINI"

[[models]]
key = "gemini-pro"
name = "Gemini 3.1 Pro — Google API"
access_method = "gemini_api"
id = "gemini-3.1-pro-preview"
context_window = 1_050_000
tag = "GEMINI"

# Same family as the agent that usually writes the code in this repo, so it is
# the weakest second opinion here on Claude-authored diffs — reach for a
# different family unless you specifically want Claude's read.
[[models]]
key = "opus"
name = "Claude Opus 5.5 — OpenRouter"
access_method = "openrouter"
id = "anthropic/claude-opus-5.5"
context_window = 1_000_000
# Not "CLAUDE": AGENTS.md reserves **[CLAUDE]** for the authoring agent's own
# PR comments, and a reviewer posting under it would be indistinguishable.
tag = "OPUS"

[[models]]
key = "grok"
name = "Grok 4.7 — OpenRouter"
access_method = "openrouter"
id = "x-ai/grok-4.7"
context_window = 500_000

[[models]]
key = "glm"
name = "GLM 5.3 — OpenRouter"
access_method = "openrouter"
id = "z-ai/glm-5.3"
context_window = 1_050_000

# Cheap tier — sanity passes on small diffs, not architecture or security review.
[[models]]
key = "gemini-lite"
name = "Gemini 3.5 Flash Lite — Google API"
access_method = "gemini_api"
id = "gemini-3.5-flash-lite"
context_window = 1_050_000
tag = "GEMINI"

# Cheapest entry in the roster. Same-family caveat as `opus` applies.
[[models]]
key = "haiku"
name = "Claude Haiku 5.5 — OpenRouter"
access_method = "openrouter"
id = "anthropic/claude-haiku-5.5"
context_window = 1_000_000
tag = "HAIKU"
